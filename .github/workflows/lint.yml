name: lint

on:
    pull_request:
    push:
      branches:
        - main

jobs:
    eslint:
       runs-on: ubuntu-latest
       steps:
        - uses: actions/checkout@v5

        - uses: actions/setup-node@v5
          with:
            node-version: 22
            cache: npm

        - run: npm ci
        - run: npm run lint 